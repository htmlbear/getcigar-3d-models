name: Export L honeycomb v3.3 vertical STL
on:
  push:
    paths:
      - 'src/GetCigar_drawer_L_honeycomb_v3_3_vertical.scad'
      - '.github/workflows/export-L-honeycomb-v3-3-vertical.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD and mesh tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad python3-trimesh
      - name: Export and orient vertical STL
        run: |
          mkdir -p stl/L_honeycomb_v3_3
          openscad -o stl/L_honeycomb_v3_3/drawer_L_vertical.stl src/GetCigar_drawer_L_honeycomb_v3_3_vertical.scad
          python3 - <<'PY'
          import trimesh, numpy as np
          p='stl/L_honeycomb_v3_3/drawer_L_vertical.stl'
          mesh=trimesh.load(p)
          assert mesh.is_watertight, 'Mesh not watertight'
          mesh.apply_transform(trimesh.transformations.rotation_matrix(np.pi/2,[1,0,0]))
          mesh.apply_translation([0,100,0])
          mesh.export(p)
          assert np.allclose(mesh.extents,[140,100,350],atol=.01)
          PY
      - name: Commit generated STL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stl/L_honeycomb_v3_3/drawer_L_vertical.stl
          if ! git diff --cached --quiet; then
            git commit -m "Export L honeycomb v3.3 vertical STL"
            git pull --rebase origin main
            git push
          fi
