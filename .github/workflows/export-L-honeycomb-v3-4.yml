name: Export L honeycomb v3.4 vertical STL
on:
  push:
    paths:
      - 'src/GetCigar_drawer_L_honeycomb_v3_4_no_divider_mounts.scad'
      - '.github/workflows/export-L-honeycomb-v3-4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Export STL
        run: |
          mkdir -p stl/L_honeycomb_v3_4
          openscad -o /tmp/drawer_original.stl src/GetCigar_drawer_L_honeycomb_v3_4_no_divider_mounts.scad
          test -s /tmp/drawer_original.stl
          python3 -m pip install --break-system-packages trimesh numpy
          python3 - <<'PY'
          import trimesh, numpy as np
          mesh = trimesh.load('/tmp/drawer_original.stl', force='mesh')
          matrix = trimesh.transformations.rotation_matrix(np.pi/2, [1,0,0])
          mesh.apply_transform(matrix)
          mesh.apply_translation([0,100,0])
          assert mesh.is_watertight
          mesh.export('stl/L_honeycomb_v3_4/drawer_L_vertical.stl')
          print('STL exported:', mesh.bounds, len(mesh.faces))
          PY
          test -s stl/L_honeycomb_v3_4/drawer_L_vertical.stl
      - name: Upload STL artifact
        uses: actions/upload-artifact@v4
        with:
          name: drawer-L-v3-4-vertical-STL
          path: stl/L_honeycomb_v3_4/drawer_L_vertical.stl
      - name: Commit STL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stl/L_honeycomb_v3_4/drawer_L_vertical.stl
          if ! git diff --cached --quiet; then
            git commit -m "Export v3.4 vertical STL"
            git pull --rebase origin main
            git push
          fi
